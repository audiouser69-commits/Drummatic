name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configura (universale arm64 + x86_64)
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DMANIPOLO_TESTS=ON

      - name: Compila
        run: cmake --build build --config Release -- -quiet

      - name: Test
        run: ./build/ManipoloTest_artefacts/Release/ManipoloTest

      - name: Firma ad-hoc e impacchetta
        run: |
          OUT=dist/Drummatic-macOS
          mkdir -p "$OUT"
          cp -R build/Manipolo_artefacts/Release/VST3/Drummatic.vst3 "$OUT/"
          cp -R build/Manipolo_artefacts/Release/Standalone/Drummatic.app "$OUT/"
          codesign --force --deep --sign - "$OUT/Drummatic.vst3"
          codesign --force --deep --sign - "$OUT/Drummatic.app"
          lipo -info "$OUT/Drummatic.vst3/Contents/MacOS/Drummatic"
          cp README.md "$OUT/LEGGIMI.md"
          cp docs/Drummatic-Manuale.pdf "$OUT/"
          cd dist && ditto -c -k --keepParent Drummatic-macOS Drummatic-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Drummatic-macOS
          path: dist/Drummatic-macOS.zip

  windows:
    # cross-compilazione con MinGW-w64 (mingw-toolchain.cmake), come da README
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build g++-mingw-w64-x86-64-posix \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev

      - name: Test del motore (trasporto, silenzi improvvisi)
        run: |
          g++ -O2 -std=c++17 Tests/transport_test.cpp -o transport_test && ./transport_test
          g++ -O2 -std=c++17 Tests/silence_test.cpp -o silence_test && ./silence_test 5 1 && ./silence_test 5 2

      - name: Compila
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/mingw-toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win -j3

      - name: Impacchetta
        run: |
          OUT=dist/Drummatic-Windows
          mkdir -p "$OUT"
          cp build-win/Manipolo_artefacts/Release/Standalone/Drummatic.exe "$OUT/"
          cp -R build-win/Manipolo_artefacts/Release/VST3/Drummatic.vst3 "$OUT/"
          cp README.md "$OUT/LEGGIMI.md"
          cp docs/Drummatic-Manuale.pdf "$OUT/"
          cd dist && zip -qr Drummatic-Windows.zip Drummatic-Windows

      - uses: actions/upload-artifact@v4
        with:
          name: Drummatic-Windows
          path: dist/Drummatic-Windows.zip

  release:
    # un tag v* (es. v0.2.3): release su GitHub con i due pacchetti
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Drummatic-macOS/Drummatic-macOS.zip
            dist/Drummatic-Windows/Drummatic-Windows.zip

  pacchetti:
    # i due zip dell'ultimo push su main anche nel ramo "pacchetti" (scaricabili con git, senza login ad Actions)
    if: github.ref == 'refs/heads/main'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Pubblica nel ramo pacchetti
        run: |
          mkdir pub && cd pub
          git init -q -b pacchetti
          cp ../dist/Drummatic-macOS/Drummatic-macOS.zip ../dist/Drummatic-Windows/Drummatic-Windows.zip .
          printf 'Drummatic: pacchetti della build %s (%s).\n' "${GITHUB_SHA::7}" "$(date -u +%F)" > LEGGIMI.txt
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Pacchetti della build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pacchetti
