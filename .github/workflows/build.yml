name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configura (universale arm64 + x86_64)
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DMANIPOLO_TESTS=ON

      - name: Compila
        run: cmake --build build --config Release -- -quiet

      - name: Test
        run: ./build/ManipoloTest_artefacts/Release/ManipoloTest

      - name: Firma ad-hoc e impacchetta
        run: |
          OUT=dist/Manipolo-macOS
          mkdir -p "$OUT"
          cp -R build/Manipolo_artefacts/Release/VST3/Manipolo.vst3 "$OUT/"
          cp -R build/Manipolo_artefacts/Release/Standalone/Manipolo.app "$OUT/"
          codesign --force --deep --sign - "$OUT/Manipolo.vst3"
          codesign --force --deep --sign - "$OUT/Manipolo.app"
          lipo -info "$OUT/Manipolo.vst3/Contents/MacOS/Manipolo"
          cp README.md "$OUT/LEGGIMI.md"
          cd dist && ditto -c -k --keepParent Manipolo-macOS Manipolo-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Manipolo-macOS
          path: dist/Manipolo-macOS.zip
