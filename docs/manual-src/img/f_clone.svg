5"/><rect x="500" y="54.4790363948278" width="14" height="55.5209636051722" rx="2" fill="#1d2126" fill-opacity=".85"/><rect x="520" y="37.36721221960384" width="14" height="72.63278778039616" rx="2" fill="#1d2126" fill-opacity=".85"/><rect x="540" y="40.802389850754" width="14" height="69.197610149246" rx="2" fill="#1d2126" fill-opacity=".85"/><text x="600" y="40" font-family="Inter, sans-serif" font-size="11.5" fill="#1d2126" text-anchor="start" font-weight="700">8 bande di frequenza</text><text x="600" y="56" font-family="Inter, sans-serif" font-size="9.5" fill="#5f6873" text-anchor="start" font-weight="400">VARIATION decide quanto</text><text x="600" y="69" font-family="Inter, sans-serif" font-size="9.5" fill="#5f6873" text-anchor="start" font-weight="400">cambia ogni banda a ogni colpo</text><text x="600" y="92" font-family="Inter, sans-serif" font-size="9.5" fill="#5f6873" text-anchor="start" font-weight="400">TILT inclina le bande</text><text x="600" y="105" font-family="Inter, sans-serif" font-size="9.5" fill="#5f6873" text-anchor="start" font-weight="400">dai bassi agli acuti</text><text x="600" y="128" font-family="Inter, sans-serif" font-size="9.5" fill="#5f6873" text-anchor="start" font-weight="400">DAMP sopra il centro smorza</text><text x="600" y="141" font-family="Inter, sans-serif" font-size="9.5" fill="#5f6873" text-anchor="start" font-weight="400">gli acuti, sotto esalta le risonanze</text><text x="20" y="150" font-family="Inter, sans-serif" font-size="9.5" fill="#5f6873" text-anchor="start" font-weight="400">Stesso campione, tre colpi: il timbro cambia appena, come un musicista vero che non colpisce mai due volte uguale.</text></svg>